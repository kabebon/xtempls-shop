  <!-- Main -->
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title">Подписчики бота</div>
      <input class="search-input" id="searchInput" type="text" placeholder="🔍 Поиск по имени, @username или chat_id..."
        style="max-width:360px;" oninput="onSearchInput()" />
    </div>

    <div class="page-content" style="padding:0">
      <div class="table-card" style="border-radius:0;border-left:none;border-right:none;border-bottom:none;">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Подписчик</th>
                <th>@username</th>
                <th>Контакты</th>
                <th>Заказов</th>
                <th>Потрачено</th>
                <th>Подписался</th>
                <th>Последний заказ</th>
              </tr>
            </thead>
            <tbody id="subscribersTable">
              <tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:40px">Загрузка...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
  requireAuth();
  loadAdminInfo();

  let currentPage = 1;
  let totalPages = 1;
  let currentSearch = '';
  let searchTimer = null;

  function onSearchInput() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      currentSearch = document.getElementById('searchInput').value.trim();
      currentPage = 1;
      loadSubscribers();
    }, 300);
  }

  function fullName(s) {
    const parts = [s.first_name, s.last_name].filter(Boolean);
    return parts.join(' ') || '—';
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('ru-RU', {
      day: '2-digit', month: '2-digit', year: '2-digit',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function contactsBlock(s) {
    const parts = [];
    if (s.last_phone) parts.push('📞 ' + s.last_phone);
    if (s.last_telegram) parts.push('💬 @' + String(s.last_telegram).replace(/^@/, ''));
    return parts.length ? parts.join('<br>') : '<span style="color:var(--text-muted)">—</span>';
  }

  async function loadSubscribers() {
    const params = new URLSearchParams({ page: currentPage, per_page: 20 });
    if (currentSearch) params.append('search', currentSearch);

    const res = await apiFetch(`/api/admin/subscribers?${params}`);
    if (!res.ok) {
      showToast('Ошибка загрузки', 'error');
      return;
    }
    const data = await res.json();
    totalPages = data.pages;

    const tbody = document.getElementById('subscribersTable');
    if (data.items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:40px">' +
        (currentSearch ? 'Ничего не найдено' : 'Нет подписчиков') + '</td></tr>';
    } else {
      tbody.innerHTML = data.items.map(s => {
        const tgLink = s.username
          ? `<a href="https://t.me/${s.username}" target="_blank" style="color:var(--accent)">@${s.username}</a>`
          : '—';
        const spent = s.total_spent ? `<strong>${fmt(s.total_spent)}</strong>` : '<span style="color:var(--text-muted)">—</span>';
        const orders = s.orders_count
          ? `<span class="badge badge-blue">${s.orders_count}</span>`
          : '<span style="color:var(--text-muted)">0</span>';
        return `
          <tr>
            <td>
              <strong>${fullName(s)}</strong>
              <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">ID: ${s.chat_id}</div>
            </td>
            <td>${tgLink}</td>
            <td style="font-size:12px;color:var(--text-sec)">${contactsBlock(s)}</td>
            <td>${orders}</td>
            <td>${spent}</td>
            <td style="white-space:nowrap;font-size:12px;color:var(--text-muted)">${fmtDate(s.started_at)}</td>
            <td style="white-space:nowrap;font-size:12px;color:var(--text-muted)">${fmtDate(s.last_order_at)}</td>
          </tr>
        `;
      }).join('');
    }

    renderPagination();
  }

  function renderPagination() {
    const pag = document.getElementById('pagination');
    if (totalPages <= 1) { pag.innerHTML = ''; return; }
    let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) {
        html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      } else if (Math.abs(i - currentPage) === 3) {
        html += `<span style="color:var(--text-muted);padding:0 4px">…</span>`;
      }
    }
    html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>`;
    pag.innerHTML = html;
  }

  window.goPage = function(p) {
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    loadSubscribers();
  };

  loadSubscribers();
</script>
</body>
</html>
