<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>XTEMPLS — Личный кабинет</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Playfair+Display&subset=all&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Geologica&subset=all&display=swap">
  <link rel="stylesheet" href="style.css?v=1.0.13" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- Back Button -->
<button class="back-btn" id="backBtn">
  <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
  </svg>
  <span class="back-btn-text">Назад</span>
</button>
<a href="/" class="home-btn" title="На главную">
  <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1V10"/>
  </svg>
</a>

<div class="account-wrap">

  <!-- Шапка профиля -->
  <div class="account-header" id="accountHeader">
    <div class="account-avatar" id="avatar">👤</div>
    <div class="account-header-info">
      <div class="account-name" id="userName">Загрузка…</div>
      <div class="account-email" id="userEmail"></div>
      <div class="account-badges">
        <span class="account-bonus-chip" id="bonusChip" style="display:none;">🎁 <b id="bonusAmount">0</b> ₽</span>
        <span class="account-verify-chip" id="verifyChip"></span>
      </div>
    </div>
    <button class="account-logout-btn" id="logoutBtn" title="Выйти">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
    </button>
  </div>

  <!-- Табы -->
  <nav class="account-tabs" id="accountTabs">
    <button class="account-tab active" data-tab="overview">Обзор</button>
    <button class="account-tab" data-tab="orders">Заказы</button>
    <button class="account-tab" data-tab="profile">Профиль</button>
    <button class="account-tab" data-tab="addresses">Адреса</button>
    <button class="account-tab" data-tab="favorites">Избранное</button>
    <button class="account-tab" data-tab="referral">Рефералка</button>
    <button class="account-tab" data-tab="bonuses">Бонусы</button>
    <button class="account-tab" data-tab="notifications">Уведомления</button>
  </nav>

  <!-- Контейнеры секций -->
  <section class="account-section active" id="tab-overview">
    <div class="account-stats" id="overviewStats"></div>
  </section>

  <section class="account-section" id="tab-orders">
    <div id="ordersList"></div>
  </section>

  <section class="account-section" id="tab-profile">
    <form id="profileForm">
      <label class="chk-label" for="pName">Имя</label>
      <input class="chk-input" type="text" id="pName" placeholder="Имя" />

      <label class="chk-label" for="pPhone">Телефон</label>
      <input class="chk-input" type="tel" id="pPhone" placeholder="+7 999 123-45-67" />

      <label class="chk-label" for="pEmail">Email</label>
      <input class="chk-input" type="email" id="pEmail" disabled />

      <button type="submit" class="checkout-submit-btn">Сохранить</button>
    </form>

    <div class="divider" style="margin:24px 0;"></div>

    <h3 class="account-h3">Сменить пароль</h3>
    <form id="passwordForm">
      <label class="chk-label" for="oldPass">Текущий пароль</label>
      <input class="chk-input" type="password" id="oldPass" required />

      <label class="chk-label" for="newPass">Новый пароль</label>
      <input class="chk-input" type="password" id="newPass" placeholder="Минимум 6 символов" required />

      <button type="submit" class="checkout-submit-btn">Изменить пароль</button>
    </form>
  </section>

  <section class="account-section" id="tab-addresses">
    <button class="checkout-submit-btn" id="addAddrBtn" style="background:var(--accent);">＋ Добавить адрес</button>
    <div id="addressesList"></div>

    <!-- Форма адреса (показывается по клику) -->
    <div id="addrFormWrap" class="addr-form-wrap" style="display:none;">
      <form id="addrForm">
        <input type="hidden" id="addrId" />
        <label class="chk-label" for="addrLabel">Название (Дом, Работа)</label>
        <input class="chk-input" type="text" id="addrLabel" />
        <label class="chk-label" for="addrRecipient">Получатель</label>
        <input class="chk-input" type="text" id="addrRecipient" />
        <label class="chk-label" for="addrPhone">Телефон</label>
        <input class="chk-input" type="tel" id="addrPhone" />
        <label class="chk-label" for="addrCity">Город</label>
        <input class="chk-input" type="text" id="addrCity" />
        <label class="chk-label" for="addrStreet">Улица</label>
        <input class="chk-input" type="text" id="addrStreet" />
        <div class="addr-row">
          <div>
            <label class="chk-label" for="addrHouse">Дом</label>
            <input class="chk-input" type="text" id="addrHouse" />
          </div>
          <div>
            <label class="chk-label" for="addrApt">Квартира</label>
            <input class="chk-input" type="text" id="addrApt" />
          </div>
        </div>
        <label class="chk-label" for="addrZip">Индекс</label>
        <input class="chk-input" type="text" id="addrZip" />
        <label class="chk-toggle">
          <input type="checkbox" id="addrDefault" /> Использовать по умолчанию
        </label>
        <div class="addr-form-actions">
          <button type="button" class="btn-ghost" id="addrCancelBtn">Отмена</button>
          <button type="submit" class="checkout-submit-btn" style="margin:0;">Сохранить</button>
        </div>
      </form>
    </div>
  </section>

  <section class="account-section" id="tab-favorites">
    <div id="favoritesList"></div>
  </section>

  <section class="account-section" id="tab-referral">
    <div class="ref-box">
      <h3 class="account-h3">Ваша реферальная ссылка</h3>
      <p class="ref-text">Делитесь ссылкой с друзьями. Когда они зарегистрируются и сделают покупку — вы получите бонусы.</p>
      <div class="ref-link-row">
        <input class="chk-input" id="refLink" readonly />
        <button class="checkout-submit-btn" id="copyRefBtn" style="margin:0; white-space:nowrap;">Копировать</button>
      </div>
      <div class="ref-code">Ваш код: <b id="refCode"></b></div>
      <div class="ref-stat">
        <div class="ref-stat-num" id="invitedCount">0</div>
        <div class="ref-stat-label">приглашено</div>
      </div>
      <p class="ref-note">⚙️ Логика начисления бонусов настраивается. Скоро расскажем подробнее!</p>
    </div>
  </section>

  <section class="account-section" id="tab-bonuses">
    <div class="bonus-summary">
      <div class="bonus-balance-num" id="bonusBalance">0</div>
      <div class="bonus-balance-label">бонусов на счету, ₽</div>
    </div>
    <h3 class="account-h3">История начислений</h3>
    <div id="bonusList"></div>
  </section>

  <section class="account-section" id="tab-notifications">
    <form id="notifForm">
      <label class="chk-toggle">
        <input type="checkbox" id="notifOrders" /> Статусы заказов на почту
      </label>
      <label class="chk-toggle">
        <input type="checkbox" id="notifPromo" /> Акции и скидки
      </label>
      <button type="submit" class="checkout-submit-btn">Сохранить</button>
    </form>
  </section>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="account.js?v=1.0.13"></script>
</body>
</html>
