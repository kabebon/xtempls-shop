<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>XTEMPLS — Вход</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/theme.css?v=2.0.2" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<button id="backBtn" type="button" hidden></button>
<div class="page">
<header class="site-header">
  <div class="site-bar">
    <a class="logo" href="/" aria-label="XTEMPLS — на главную"><img src="/logo-x.png" alt="" /><span>XTEMPLS</span></a>
    <nav class="nav-desktop" aria-label="Основное меню">
      <a href="/catalog.html">Каталог</a>
      <a href="/#about">О нас</a>
      <a href="/public.html">Уголок покупателя</a>
      <a href="/design.html">Индивидуальный заказ</a>
      <a class="btn btn-primary" href="/account.html">Личный кабинет</a>
    </nav>
    <button class="nav-burger" type="button" aria-label="Меню" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <nav class="nav-menu">
    <a href="/catalog.html">Каталог</a>
    <a href="/public.html">Уголок покупателя</a>
    <a href="/design.html">Индивидуальный заказ</a>
    <a class="btn btn-primary" href="/account.html">Личный кабинет</a>
  </nav>
</header>
<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-ico">X</div>
      <h1 class="auth-title">Вход в личный кабинет</h1>
      <p class="auth-subtitle" id="authSubtitle">Бонусы, заказы, адреса и реферальная программа — в одном месте.</p>
      <form id="loginForm" autocomplete="on">
        <div>
          <label class="chk-label" for="email">E-mail</label>
          <input class="chk-input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div>
          <label class="chk-label" for="password">Пароль</label>
          <input class="chk-input" type="password" id="password" name="password" placeholder="Ваш пароль" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Войти</button>
      </form>
      <p class="auth-switch">Нет аккаунта? <a href="/register.html" class="auth-link">Зарегистрироваться</a></p>
    </div>
  </div>
</main>
</div>
<div class="toast" id="toast"></div>
<script src="/nav.js?v=2.0.0" defer></script>
<script src="/account.js?v=2.0.0" defer></script>
</body>
</html>
