<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Оплата — XTEMPLS</title>
  <link rel="icon" href="/logo-x.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/theme.css?v=2.3.0" />
  <script src="/tg-boot.js"></script>
</head>
<body>
<div class="page">
<header class="site-header">
  <div class="site-bar">
    <a class="logo" href="/" aria-label="XTEMPLS — на главную"><img src="/logo-x.png" alt="" /><span>XTEMPLS</span></a>
    <a class="btn btn-primary" href="/account.html">Личный кабинет</a>
  </div>
</header>
<main class="success-container">
  <div class="auth-ico">…</div>
  <h1 class="success-heading">Проверяем оплату</h1>
  <p class="success-subtitle" id="paymentDetails">Секунду, сверяем платёж.</p>
  <div class="btn-container">
    <a class="btn btn-primary" href="/">На главную</a>
    <a class="btn btn-secondary" href="/catalog.html">Вернуться в каталог</a>
    <a class="btn btn-ghost" href="/account.html">Мои заказы</a>
  </div>
</main>
</div>
<div class="toast" id="toast"></div>
<script src="/app.js?v=2.3.3" defer></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    const orderId = new URLSearchParams(window.location.search).get('order_id');
    const details = document.getElementById('paymentDetails');
    const heading = document.querySelector('.success-heading');
    const icon = document.querySelector('.success-container .auth-ico');
    const buttons = document.querySelector('.btn-container');
    if (!orderId || !details) return;

    details.textContent = 'Заказ #' + orderId + '. Проверяем оплату…';
    const paySlot = document.createElement('div');
    paySlot.className = 'btn-container';
    paySlot.style.marginBottom = '12px';
    if (buttons && buttons.parentNode) buttons.parentNode.insertBefore(paySlot, buttons);

    let tries = 0;
    const delays = [2000, 3000, 5000, 8000, 12000];

    function showPayLink(url) {
      paySlot.replaceChildren();
      if (!url) return;
      const link = document.createElement('a');
      link.className = 'btn btn-primary';
      link.href = url;
      link.textContent = 'Перейти к оплате';
      paySlot.appendChild(link);
    }

    async function check() {
      tries += 1;
      try {
        const res = await fetch('/api/payments/status/' + encodeURIComponent(orderId));
        if (!res.ok) throw new Error('status ' + res.status);
        const data = await res.json();
        if (data.payment_status === 'paid') {
          if (icon) icon.textContent = '✓';
          if (heading) heading.textContent = 'Оплата получена';
          details.textContent = 'Заказ #' + orderId + ' оплачен. Менеджер свяжется с вами в ближайшее время.';
          paySlot.replaceChildren();
          return;
        }
        if (icon) icon.textContent = '…';
        if (heading) heading.textContent = 'Проверяем оплату';
        if (data.payment_url) {
          details.textContent = 'Заказ #' + orderId + ' ещё не оплачен. Если списание уже прошло, страница обновится сама. Если нет — вернитесь к оплате, заказ сохранится.';
          showPayLink(data.payment_url);
        } else {
          details.textContent = 'Заказ #' + orderId + ' сохранён. Ссылку на оплату сейчас получить не удалось — обновите страницу через минуту.';
          paySlot.replaceChildren();
        }
      } catch (e) {
        details.textContent = 'Заказ #' + orderId + '. Не удалось проверить оплату, обновите страницу через минуту.';
      }
      if (tries <= delays.length) setTimeout(check, delays[tries - 1]);
    }
    check();
  });
</script>
</body>
</html>
