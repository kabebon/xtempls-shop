<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Оплата прошла успешно — XTEMPLS</title>
  <link rel="icon" href="/logo-x.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/theme.css?v=2.1.0" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="page">
<header class="site-header">
  <div class="site-bar">
    <a class="logo" href="/" aria-label="XTEMPLS — на главную"><img src="/logo-x.png" alt="" /><span>XTEMPLS</span></a>
    <a class="btn btn-primary" href="/account.html">Личный кабинет</a>
  </div>
</header>
<main class="success-container">
  <div class="auth-ico">✓</div>
  <h1 class="success-heading">Оплата получена</h1>
  <p class="success-subtitle" id="paymentDetails">Спасибо за заказ. Мы уже начали его собирать.</p>
  <div class="btn-container">
    <a class="btn btn-primary" href="/">На главную</a>
    <a class="btn btn-secondary" href="/catalog.html">Вернуться в каталог</a>
    <a class="btn btn-ghost" href="/account.html">Мои заказы</a>
  </div>
</main>
</div>
<div class="toast" id="toast"></div>
<script src="/app.js?v=2.1.0" defer></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    const orderId = new URLSearchParams(window.location.search).get('order_id');
    if (orderId) {
      document.getElementById('paymentDetails').textContent =
        'Заказ #' + orderId + ' оплачен. Менеджер свяжется с вами в ближайшее время.';
    }
  });
</script>
</body>
</html>
