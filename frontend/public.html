<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Уголок покупателя — XTEMPLS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/styles/styles-layout.css">
  <link rel="stylesheet" href="/assets/styles/footer-customer-type-5.css">
  <link rel="stylesheet" href="/style.css?v=1.0.18">
  <script src="/app.js?v=1.0.18" defer></script>
</head>
<body>
<button class="back-btn" onclick="window.location.href='/'" style="position:fixed; z-index:100;">
  <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
  </svg>
</button>

<div class="legal-wrap">
  <h1 class="sb-font-h3" style="margin-bottom:18px;">Уголок покупателя</h1>
  <div class="legal-tabs" id="legalTabs"></div>
  <article class="legal-body" id="legalBody">Загрузка…</article>
</div>

<script>
(async function () {
  const tabs = document.getElementById('legalTabs');
  const body = document.getElementById('legalBody');
  const hash = (location.hash || '').replace('#', '');
  try {
    const res = await fetch('/api/pages');
    if (!res.ok) throw new Error('fail');
    const pages = await res.json();
    if (!pages.length) throw new Error('empty');
    let current = pages.find(p => p.key === hash) || pages[0];
    function paint(page) {
      current = page;
      history.replaceState(null, '', '#' + page.key);
      document.title = page.title + ' — XTEMPLS';
      tabs.innerHTML = pages.map(p =>
        `<button class="legal-tab ${p.key === page.key ? 'active' : ''}" data-key="${p.key}">${p.title}</button>`
      ).join('');
      body.textContent = page.content || '';
      tabs.querySelectorAll('.legal-tab').forEach(btn => {
        btn.onclick = () => paint(pages.find(p => p.key === btn.dataset.key));
      });
    }
    paint(current);
  } catch (e) {
    body.textContent = 'Не удалось загрузить документы. Напишите на xtempls@yandex.ru.';
  }
})();
</script>
</body>
</html>
