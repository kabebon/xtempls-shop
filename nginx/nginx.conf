worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    client_max_body_size 20M;

    # Rate limiting
    # NOTE: per-IP rate limits must not drop legitimate orders from the same
    # network/admin. The orders zone is keyed on the customer contact (passed
    # by the frontend) when present, falling back to the client IP, and uses a
    # generous burst so multiple users behind one IP are not throttled.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=orders:10m rate=10r/m;

    # ── HTTP → HTTPS redirect, кроме ACME-challenge (нужно certbot для валидации) ─
    server {
        listen 80;
        server_name xtempls.ru www.xtempls.ru;

        # Let's Encrypt validation (webroot). Должно остаться на http — certbot
        # при renew (если используется webroot) обращается сюда по 80.
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html/acme;
        }

        # Всё остальное → https.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS — основной сервер со всей логикой ────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name xtempls.ru www.xtempls.ru;

        # ── SSL ────────────────────────────────────────────────────────────────
        # Сертификаты монтируются из /etc/letsencrypt хоста (compose volume
        # ./nginx/ssl:/etc/letsencrypt). См. README → раздел «SSL».
        ssl_certificate     /etc/letsencrypt/live/xtempls.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/xtempls.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ACME-challenge (на случай webroot-renew поверх https).
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html/acme;
        }

        # API — FastAPI backend
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Auth rate limit
        location /api/auth/login {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://backend:8000/api/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Order creation — generous burst so multiple orders from one network
        # (shared Wi-Fi, same admin, NAT) are not dropped. Spammers are still
        # bounded by the per-IP rate defined in limit_req_zone "orders".
        location = /api/orders/ {
            limit_req zone=orders burst=20 nodelay;
            proxy_pass http://backend:8000/api/orders/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Uploaded images
        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Admin panel
        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            try_files $uri $uri/ /admin/index.html;
            expires -1;
        }

        # Mini App (root)
        location / {
            root /usr/share/nginx/html/app;
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
